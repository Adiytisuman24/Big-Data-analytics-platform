apiVersion: v1
kind: Namespace
metadata:
  name: analytics-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker
  namespace: analytics-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broker
  template:
    metadata:
      labels:
        app: broker
    spec:
      containers:
      - name: broker
        image: confluentinc/cp-server:7.5.0
        ports:
        - containerPort: 9092
        env:
        - name: KAFKA_NODE_ID
          value: "1"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
        - name: KAFKA_ADVERTISED_LISTENERS
          value: 'PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092'
        - name: KAFKA_PROCESS_ROLES
          value: 'broker,controller'
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: '1@broker:29093'
        - name: KAFKA_LISTENERS
          value: 'PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092'
        - name: CLUSTER_ID
          value: 'MkU3OEVBNTcwNTJENDM2Qk'
---
apiVersion: v1
kind: Service
metadata:
  name: broker
  namespace: analytics-platform
spec:
  ports:
  - port: 9092
    targetPort: 9092
    name: kafka
  - port: 29092
    targetPort: 29092
    name: internal
  selector:
    app: broker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: analytics-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:RELEASE.2023-09-07T02-05-02Z
        args: ["server", "/data", "--console-address", ":9001"]
        ports:
        - containerPort: 9000
        - containerPort: 9001
        env:
        - name: MINIO_ROOT_USER
          value: "admin"
        - name: MINIO_ROOT_PASSWORD
          value: "password123"
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: analytics-platform
spec:
  ports:
  - port: 9000
    targetPort: 9000
  - port: 9001
    targetPort: 9001
  selector:
    app: minio
